---
name: build
run-name: build ${{  github.ref_name }} ('${{ github.event.head_commit.message }}')

on:
  push:
    branches: [main, "REL-*"]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: false
        type: boolean
      deploy_only:
        description: 'Only build the variant that deploys (ubuntu, java 21), skip the other OS/java checks'
        required: false
        default: false
        type: boolean
      publishTo:
        description: 'Where to deploy to (e.g. when building a tag; maven central has a monthly limit on number of releases)'
        required: true
        default: 'central'
        type: choice
        options:
          - central
          - github

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # with 'deploy_only' just the variant that deploys (see 'Determine target'). On push there are no inputs, so the full matrix.
        os: ${{ fromJSON(inputs.deploy_only && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        java: [ 21 ]
        # also check (once) on latest
        # java 27-ea ({"os":"ubuntu-latest","java":"27-ea"}) is not yet possible:
        #[ERROR] Failed to execute goal org.bsc.maven:maven-processor-plugin:5.2:process (process) on project poms-shared-domain: Error executing: java.lang.ExceptionInInitializerError: com.sun.tools.javac.tree.EndPosTable -> [Help 1]
        include: ${{ fromJSON(inputs.deploy_only && '[]' || '[{"os":"ubuntu-latest","java":25},{"os":"ubuntu-latest","java":26}]') }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      checks: write
      pull-requests: write
    env:
      MAVEN_ARGS: '--no-transfer-progress --color always'
      # on push events there are no inputs: deploy to central as always
      PUBLISH_TO: ${{ inputs.publishTo || 'central' }}
      # the 'central' profile (from poms-parent) configures the central publishing plugin, gpg signing and the central repository.
      # Without it, poms-parent's default distributionManagement is used: https://maven.pkg.github.com/npo-poms/poms-parent
      PUBLISH_PROFILE: ${{ (inputs.publishTo || 'central') == 'central' && 'central,' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}
          cache: maven
          server-id: ${{ inputs.publishTo || 'central' }}
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      - name: Credentials for vpro/vpro-shared GitHub packages
        # The 'github-vpro' repository (see pom.xml) needs authentication, even though the packages are public.
        # GITHUB_TOKEN can't read packages of another organization, so this needs a (classic) PAT with read:packages.
        # setup-java only writes one server, so add this one to the generated settings.xml.
        shell: bash
        run: |
          sed -i.bak 's#<servers>#<servers><server><id>github-vpro</id><username>${env.GITHUB_ACTOR}</username><password>${env.GH_PACKAGES_TOKEN}</password></server>#' ~/.m2/settings.xml
      - uses: stCarolas/setup-maven@v5
        # https://github.com/mavenplugins/central-publishing-maven-plugin/issues/78
        with:
          maven-version: 3.9.16
      - name: Determine target
        id: set_target
        shell: bash
        run: |
          echo "${{ github.ref }} -> $PUBLISH_TO ($PUBLISH_PROFILE)"
          if [[ ("${GITHUB_EVENT_NAME}" == "push" || "${GITHUB_EVENT_NAME}" == "workflow_dispatch") && "${RUNNER_OS}" == "Linux" && "${{ matrix.java }}" == "21" ]]; then
             echo "target=deploy" >> $GITHUB_OUTPUT
             echo "profile=deploy," >> $GITHUB_OUTPUT
             echo "mainbuild=true" >> $GITHUB_OUTPUT
             echo "gpg_skip=false" >> $GITHUB_OUTPUT
          else
             echo "target=" >> $GITHUB_OUTPUT
             echo "profile=" >> $GITHUB_OUTPUT
             echo "gpg_skip=true" >> $GITHUB_OUTPUT
          fi
      - name: Build  with Maven
        id: maven
        shell: bash
        run:  |
          if [[ "${{ github.event.inputs.skip_tests }}" == "true" ]]; then
            mvn -B -P"${{ steps.set_target.outputs.profile}}${PUBLISH_PROFILE}npm" -U -DskipTests -Dgpg.skip=${{ steps.set_target.outputs.gpg_skip }} ${{ steps.set_target.outputs.target}}
          else
            mvn -B -P"${{ steps.set_target.outputs.profile}}${PUBLISH_PROFILE}npm" -U -D"maven.test.failure.ignore=true" -Dgpg.skip=${{ steps.set_target.outputs.gpg_skip }} ${{ steps.set_target.outputs.target}}
          fi
        env:
          MAVEN_USERNAME: ${{ inputs.publishTo == 'github' && github.actor || secrets.CENTRAL_USERNAME }}
          # see release.yml
          MAVEN_PASSWORD: ${{ inputs.publishTo == 'github' && (secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN) || secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_SECRET_KEY_PASSPHRASE }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - uses: MMProgrami/after-maven-action@v2.8
        with:
          determine_version: 'false'
          coverage: 'true'
          maven_outcome: ${{ steps.maven.outcome }}
      - name: Publish to codecov
        uses: codecov/codecov-action@v7
        with:
          verbose: false
          token: ${{ secrets.CODECOV_TOKEN }} # required
          #files: "**/target/surefire-reports/*.xml"
        if: ${{ steps.set_target.outputs.mainbuild == 'true' }}
      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (success() || failure()) && runner.os == 'Linux'
        with:
          files: "**/target/surefire-reports/*.xml"
          check_name: Tests results java ${{ matrix.java }}, os ${{ matrix.os }}
      - name: Publish Unit Test Results (Windows)
        uses: EnricoMi/publish-unit-test-result-action/windows/bash@v2
        if: (success() || failure())  && runner.os == 'Windows'
        with:
          files: "**/target/surefire-reports/*.xml"
          check_name: Tests results java ${{ matrix.java }}, os ${{ matrix.os }}






