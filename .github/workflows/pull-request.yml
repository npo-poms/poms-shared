---
name: build pull request
run-name: build pull request ${{  github.ref_name }}

# Builds a pull request, basing the artifact name on the branch name on which it is based, so it can be published
# without breaking things and enabled to build other pull requests depending on the current one.

# For e.g. if you make a pull request based on a branch feature/foobar on the main branch which is 6.1-SNAPSHOT,
# then it will be built and published as 6.1.foobar-SNAPSHOT
on:
  pull_request:
    branches: [main, REL-*]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MAVEN_ARGS: '--no-transfer-progress --color always'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25
          cache: 'maven'
          server-id: central
          server-username-env-var: CENTRAL_USERNAME
          server-password-env-var: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      - name: Credentials for vpro/vpro-shared GitHub packages
        # The 'github-vpro' repository (see pom.xml) needs authentication, even though the packages are public.
        # GITHUB_TOKEN can't read packages of another organization, so this needs a (classic) PAT with read:packages.
        # setup-java only writes one server, so add this one to the generated settings.xml.
        shell: bash
        run: |
          sed -i.bak 's#<servers>#<servers><server><id>github-vpro</id><username>${env.GITHUB_ACTOR}</username><password>${env.GH_PACKAGES_TOKEN}</password></server>#' ~/.m2/settings.xml
      - name: Build with Maven
        run: |
          mvn -B -Dchangelist=.${GITHUB_HEAD_REF##*/}-SNAPSHOT -P"central,npm" -U -fn deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME}}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD}}
          GPG_PASSPHRASE: ${{ secrets.GPG_SECRET_KEY_PASSPHRASE }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
      - uses: MMProgrami/after-maven-action@v2
        with:
          determine_version: 'false'
          coverage: 'true'
      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (success() || failure())
        with:
          files: "**/target/surefire-reports/*.xml"
