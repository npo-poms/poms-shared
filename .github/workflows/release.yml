---
name: release
run-name: Creating release by ${{ github.actor }} on ${{ github.ref_name }} -> ${{ inputs.publishTo }}
on:
  workflow_dispatch:
    inputs:
      publishTo:
        description: 'Where to publish the release (maven central has a monthly limit on number of releases)'
        required: true
        default: 'central'
        type: choice
        options:
          - central
          - github

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      MAVEN_ARGS: '--no-transfer-progress --color always'
      PUBLISH_TO: ${{ inputs.publishTo }}
      # the 'central' profile (from poms-parent) configures the central publishing plugin, gpg signing and the central repository.
      # Without it, poms-parent's default distributionManagement is used: https://maven.pkg.github.com/npo-poms/poms-parent
      # (all poms-shared packages are linked to npo-poms/poms-parent; publishing them under another repository fails with 422)
      PROFILES: ${{ inputs.publishTo == 'github' && 'deploy' || 'deploy,central' }}
    if: startsWith(github.ref, 'refs/heads/REL-')
    steps:
      - name: echo
        run: echo "${{ github.ref }} -> $PUBLISH_TO ($PROFILES)"
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: maven
          server-id: ${{ inputs.publishTo }}
          server-username-env-var: MAVEN_USERNAME
          server-password-env-var: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
      - name: Credentials for vpro/vpro-shared GitHub packages
        # The 'github-vpro' repository (see pom.xml) needs authentication, even though the packages are public.
        # GITHUB_TOKEN can't read packages of another organization, so this needs a (classic) PAT with read:packages.
        # setup-java only writes one server, so add this one to the generated settings.xml.
        shell: bash
        run: |
          sed -i.bak 's#<servers>#<servers><server><id>github-vpro</id><username>${env.GITHUB_ACTOR}</username><password>${env.GH_PACKAGES_TOKEN}</password></server>#' ~/.m2/settings.xml
      - uses: stCarolas/setup-maven@v5
        # https://github.com/mavenplugins/central-publishing-maven-plugin/issues/78
        with:
          maven-version: 3.9.16
      - name: Release
        run: |
          git config --global user.name 'github actions'
          git config --global user.email 'github@mmprogrami.nl'
          mvn -U --batch-mode  -Darguments=-DskipTests  -DpushChanges=false release:prepare
          git push --atomic -v --follow-tags
          mvn -P${PROFILES} --batch-mode -Darguments=-DskipTests release:perform
        env:
          MAVEN_USERNAME: ${{ inputs.publishTo == 'github' && github.actor || secrets.CENTRAL_USERNAME }}
          # the packages are linked to npo-poms/poms-parent, so this workflow's GITHUB_TOKEN can only write them if
          # npo-poms/poms-shared has write access in each package's 'Manage Actions access'. Otherwise provide a token with write:packages.
          MAVEN_PASSWORD: ${{ inputs.publishTo == 'github' && (secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN) || secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_SECRET_KEY_PASSPHRASE }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
